<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ark 面试通后台</title>
    <link rel="stylesheet" href="/admin/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">ArkInterview Admin</p>
        <h1>运营后台</h1>
      </div>
      <div class="topbar-actions">
        <button id="refreshButton" class="icon-button" title="刷新数据" aria-label="刷新数据" hidden>↻</button>
        <button id="logoutButton" class="secondary-button" type="button" hidden>退出</button>
      </div>
    </header>

    <main id="authView" class="auth-layout">
      <section class="auth-panel" aria-labelledby="authTitle">
        <p class="eyebrow">Protected Console</p>
        <h2 id="authTitle">管理员验证</h2>
        <form id="authForm" class="auth-form">
          <label for="adminTokenInput">管理员令牌</label>
          <input
            id="adminTokenInput"
            name="adminToken"
            type="password"
            minlength="32"
            autocomplete="current-password"
            spellcheck="false"
            required
          >
          <button class="primary-button" type="submit">进入后台</button>
          <p id="authMessage" class="auth-message" role="alert"></p>
        </form>
      </section>
    </main>

    <main id="adminView" class="layout" hidden>
      <nav class="admin-tabs" aria-label="后台功能">
        <button class="admin-tab active" type="button" data-view="questions">题库管理</button>
        <button class="admin-tab" type="button" data-view="leaderboard">排行榜审计</button>
      </nav>

      <div id="questionManagementView" class="management-view">
      <section class="panel stats-panel" aria-label="题库概览">
        <div>
          <span class="metric-label">分类</span>
          <strong id="categoryCount">0</strong>
        </div>
        <div>
          <span class="metric-label">题目</span>
          <strong id="questionCount">0</strong>
        </div>
        <div>
          <span class="metric-label">已发布</span>
          <strong id="publishedCount">0</strong>
        </div>
        <div>
          <span class="metric-label">草稿</span>
          <strong id="draftCount">0</strong>
        </div>
      </section>

      <section class="panel form-panel" aria-label="新增题目">
        <div class="panel-heading">
          <h2>新增题目</h2>
          <span id="formMessage" class="form-message" role="status"></span>
        </div>
        <form id="questionForm" class="question-form">
          <label>
            分类
            <select id="categoryInput" name="categoryId" required></select>
          </label>
          <label>
            题型
            <select id="questionTypeInput" name="type" required>
              <option value="single">单选题</option>
              <option value="multiple">多选题</option>
              <option value="boolean">判断题</option>
              <option value="short">简答题</option>
            </select>
          </label>
          <label>
            难度
            <select name="difficulty">
              <option value="easy">简单</option>
              <option value="medium" selected>中等</option>
              <option value="hard">困难</option>
            </select>
          </label>
          <label>
            状态
            <select name="status">
              <option value="draft">草稿</option>
              <option value="published">发布</option>
              <option value="offline">下架</option>
            </select>
          </label>
          <label>
            审核状态
            <select name="reviewStatus">
              <option value="needs_review" selected>待核验</option>
              <option value="verified">已核验</option>
              <option value="rejected">已驳回</option>
            </select>
          </label>

          <label class="full-row">
            题干
            <textarea name="title" rows="2" required placeholder="输入面试题题干"></textarea>
          </label>

          <label class="choice-field full-row">
            选项
            <textarea name="optionsText" rows="4" placeholder="每行一个选项，例如：&#10;A. 使用明确类型&#10;B. 全部写 any"></textarea>
          </label>

          <label class="choice-field">
            正确选项
            <input name="correctOptionIds" placeholder="例如：a 或 a,b">
          </label>

          <label class="boolean-field">
            判断答案
            <select name="answerBoolean">
              <option value="true">正确</option>
              <option value="false">错误</option>
            </select>
          </label>

          <label class="short-field full-row">
            参考答案
            <textarea name="referenceAnswer" rows="3" placeholder="简答题参考答案"></textarea>
          </label>

          <label class="short-field full-row">
            评分点
            <textarea name="scoringPointsText" rows="3" placeholder="每行一个评分点"></textarea>
          </label>

          <label class="full-row">
            解析
            <textarea name="explanation" rows="3" placeholder="答题后展示的解析"></textarea>
          </label>

          <label class="full-row">
            知识点
            <input name="knowledgePointsText" placeholder="用逗号分隔，例如：ArkTS, 类型系统">
          </label>

          <label class="full-row">
            官方来源
            <textarea name="sourceRefsText" rows="3" placeholder="每行一个来源：标题 | https://developer.huawei.com/..."></textarea>
          </label>

          <label>
            核验日期
            <input name="verifiedAt" type="date">
          </label>

          <div class="form-actions full-row">
            <button type="submit" class="primary-button">保存题目</button>
            <button type="reset" class="secondary-button">清空</button>
          </div>
        </form>
      </section>

      <section class="content-grid">
        <aside class="panel category-panel">
          <div class="panel-heading">
            <h2>分类</h2>
          </div>
          <div id="categoryList" class="category-list"></div>
        </aside>

        <section class="panel question-panel">
          <div class="panel-heading question-heading">
            <div class="heading-title">
              <h2>题目</h2>
              <span id="visibleQuestionCount" class="visible-count">0 条</span>
            </div>
            <div class="filter-controls">
              <select id="typeFilter" aria-label="题型筛选">
                <option value="">全部题型</option>
                <option value="single">单选题</option>
                <option value="multiple">多选题</option>
                <option value="boolean">判断题</option>
                <option value="short">简答题</option>
              </select>
              <select id="reviewStatusFilter" aria-label="审核状态筛选">
                <option value="">全部审核状态</option>
                <option value="needs_review">待核验</option>
                <option value="verified">已核验</option>
                <option value="rejected">已驳回</option>
              </select>
              <select id="publishStatusFilter" aria-label="发布状态筛选">
                <option value="">全部发布状态</option>
                <option value="draft">草稿</option>
                <option value="published">已发布</option>
                <option value="offline">已下架</option>
              </select>
            </div>
          </div>
          <div id="batchToolbar" class="batch-toolbar">
            <label class="select-visible">
              <input id="selectVisibleQuestions" type="checkbox">
              全选当前筛选
            </label>
            <span class="selection-summary">已选择 <strong id="selectedQuestionCount">0</strong> 道</span>
            <div class="batch-actions">
              <button id="batchPublishButton" class="primary-button" type="button" disabled>批量发布</button>
              <button id="batchOfflineButton" class="danger-button" type="button" disabled>批量下架</button>
              <button id="clearSelectionButton" class="secondary-button" type="button" disabled>取消选择</button>
            </div>
          </div>
          <div id="questionList" class="question-list"></div>
        </section>
      </section>
      </div>

      <div id="leaderboardAuditView" class="management-view" hidden>
        <section class="panel stats-panel audit-stats" aria-label="排行榜审计概览">
          <div>
            <span class="metric-label">账号用户</span>
            <strong id="auditAccountCount">0</strong>
          </div>
          <div>
            <span class="metric-label">已授权参与</span>
            <strong id="auditOptInCount">0</strong>
          </div>
          <div>
            <span class="metric-label">待复核</span>
            <strong id="auditFlaggedCount">0</strong>
          </div>
          <div>
            <span class="metric-label">已封禁</span>
            <strong id="auditSuspendedCount">0</strong>
          </div>
        </section>

        <section class="panel audit-panel">
          <div class="panel-heading audit-heading">
            <div class="heading-title">
              <h2>参与用户审计</h2>
              <span id="auditVisibleCount" class="visible-count">0 人</span>
            </div>
            <form id="auditFilterForm" class="audit-filters">
              <input
                id="auditSearchInput"
                type="search"
                maxlength="100"
                placeholder="搜索昵称或用户 ID"
                aria-label="搜索排行榜用户"
              >
              <select id="auditRiskFilter" aria-label="风险等级筛选">
                <option value="all">全部风险</option>
                <option value="flagged">只看待复核</option>
                <option value="high">高风险</option>
                <option value="review">需复核</option>
                <option value="normal">正常</option>
              </select>
              <select id="auditStatusFilter" aria-label="账号状态筛选">
                <option value="all">全部状态</option>
                <option value="active">正常账号</option>
                <option value="suspended">已封禁</option>
              </select>
              <button class="secondary-button" type="submit">查询</button>
            </form>
          </div>
          <div class="audit-note">
            <span>系统仅标记异常提交频率，不会自动封禁。</span>
            <span id="auditMessage" class="form-message" role="status"></span>
          </div>
          <div class="audit-table-wrap">
            <table class="audit-table">
              <thead>
                <tr>
                  <th scope="col">账号</th>
                  <th scope="col">状态 / 风险</th>
                  <th scope="col">积分</th>
                  <th scope="col">有效提交</th>
                  <th scope="col">峰值频率</th>
                  <th scope="col">最近作答</th>
                  <th scope="col"><span class="sr-only">操作</span></th>
                </tr>
              </thead>
              <tbody id="auditTableBody"></tbody>
            </table>
            <p id="auditEmpty" class="empty" hidden>当前筛选条件下没有账号。</p>
          </div>
        </section>
      </div>
    </main>

    <dialog id="moderationDialog" class="moderation-dialog">
      <form id="moderationForm" class="moderation-form">
        <div>
          <p class="eyebrow">Account Moderation</p>
          <h2 id="moderationTitle">账号处理</h2>
          <p id="moderationDescription" class="dialog-description"></p>
        </div>
        <label for="moderationReasonInput">
          操作原因
          <textarea
            id="moderationReasonInput"
            minlength="4"
            maxlength="300"
            rows="4"
            required
            placeholder="填写复核依据，操作记录会永久保留"
          ></textarea>
        </label>
        <p id="moderationMessage" class="auth-message" role="alert"></p>
        <div class="form-actions">
          <button id="moderationCancelButton" class="secondary-button" type="button">取消</button>
          <button id="moderationSubmitButton" class="danger-button" type="submit">确认封禁</button>
        </div>
      </form>
    </dialog>

    <script src="/admin/app.js" type="module"></script>
  </body>
</html>
